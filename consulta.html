<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Técnica - Expan Diesel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E8B730;
            --secondary: #1A1A1A;
            --accent: #2D2D2D;
            --text-main: #F2F2F2;
            --text-muted: #A0A0A0;
            --glass-bg: rgba(45, 45, 45, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--secondary);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Abstract Background Animation */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 15% 50%, rgba(26, 26, 26, 1), rgba(20, 20, 20, 1));
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 183, 48, 0.15) 0%, rgba(0,0,0,0) 70%);
            animation: float 15s infinite ease-in-out alternate;
        }

        .p1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .p2 { width: 600px; height: 600px; top: 40%; right: -200px; animation-delay: -5s; }
        .p3 { width: 300px; height: 300px; bottom: -50px; left: 20%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Glassmorphism Utilities */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 24px;
        }

        /* Header */
        header {
            padding: 30px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(180deg, rgba(26,26,26,0.9) 0%, rgba(26,26,26,0) 100%);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            max-height: 40px;
            margin-bottom: 15px;
        }

        h1.title {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--primary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Main Content Sections */
        main {
            padding: 40px 0;
        }

        /* Hero */
        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .repair-code {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(232, 183, 48, 0.3);
            display: inline-block;
        }

        .repair-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Section Titles */
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
        }

        .section-title svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Application */
        .application-text {
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chip {
            background: rgba(232, 183, 48, 0.1);
            border: 1px solid rgba(232, 183, 48, 0.3);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .chip:hover {
            background: rgba(232, 183, 48, 0.2);
            transform: translateY(-2px);
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        
        .code-cell {
            font-family: monospace;
            color: #fff;
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Images */
        .images-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media(min-width: 600px) {
            .images-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .image-card {
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: var(--accent);
            border: 1px solid var(--glass-border);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .image-card:hover img {
            transform: scale(1.05);
        }

        .image-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Compatible Injectors */
        .injector-chips {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }

        .injector-chip {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            text-align: center;
            color: #ddd;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 20px;
        }

        .footer-logo {
            height: 24px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .footer-text {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <div class="bg-animation">
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
    </div>

    <header>
        <div class="container">
            <img src="assets/logo-expan.png" alt="Expan Diesel Logo" class="logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgNDAiPjx0ZXh0IHk9IjMwIiBmb250LWZhbWlseT0iSW50ZXIiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiNFOEI3MzAiPkVYUEFOIERJRVNFTDwvdGV4dD48L3N2Zz4='">
            <h1 class="title">Consulta Técnica</h1>
        </div>
    </header>

    <main class="container" id="main-content">
        <!-- Conteúdo gerado dinamicamente pelo JavaScript -->
    </main>

    <footer>
        <img src="assets/logo-expan.png" alt="Expan Diesel Logo" class="footer-logo" onerror="this.style.display='none'">
        <p class="footer-text">© 2026 Expan Diesel — Qualidade e Precisão em Reparos Diesel</p>
    </footer>

    <script>
        // ── CATÁLOGO COMPLETO DE REPAROS ──────────────────────────────────
        const CATALOGO = {
            "EXP18121998": {
                codigoExibido: "EXP 18121998",
                tipo: "injetor",
                refComponente: "",
                nome: "Reparo para Injetores Mercedes-Benz",
                motores: ["OM900", "OM904", "OM906", "OM924", "OM926"],
                componentes: [
                    { descricao: "Luva de vedação do bico (Menor)", java: "60805001", naut: "350071", bosch: "F00ZW00003" },
                    { descricao: "Anel do porta injetor",           java: "30001016", naut: "330083", bosch: "2430210081" },
                    { descricao: "Anel da conexão do porta injetor",java: "30001014", naut: "330115", bosch: "2430210082" }
                ],
                portaInjetores: [
                    "0432191208","0432191219","0432191220","0432191258","0432191259",
                    "0432191271","0432191285","0432191301","0432191302","0432191303",
                    "0432191387","0432193400","0432193416","0432193419","0432193421",
                    "0432193436","0432193444","0432193445","0432193449","0432193479","0432193481"
                ],
                imagens: [
                    { src: "assets/img/injetor-explodido.jpg", legenda: "Vista Explodida do Injetor" },
                    { src: "assets/img/injetor-montagem.jpg",  legenda: "Montagem do Conjunto" }
                ]
            },
            "EXP4002055": {
                codigoExibido: "EXP 4002055",
                tipo: "valvula",
                refComponente: "Válvula 1418522055",
                nome: "Reparo da Válvula de Bomba Injetora",
                motores: [],
                componentes: [
                    { descricao: "6x Anéis do porta válvula",  java: "", naut: "", bosch: "1418210050" },
                    { descricao: "6x Arruelas de vedação",     java: "", naut: "", bosch: "1410105001" }
                ],
                portaInjetores: [
                    "94000083056","9400085024","0401276033","0405246209","0410472009"
                ],
                observacao: "A Bosch não fabrica o kit de reparo — os itens são vendidos separadamente. Reparo com maior demanda para bombas em linha e bomba \"A\".",
                imagens: [
                    { src: "assets/img/EXP4002055/valvula-diagrama.jpg", legenda: "Diagrama Técnico da Válvula" }
                ]
            }
        };

        // ── CONFIGURAÇÃO POR TIPO ─────────────────────────────────────────
        const TIPO_LABELS = {
            injetor: { aplicacaoTitulo: "Aplicação",        aplicacaoTexto: "Aplicável nos injetores dos motores:",     compativelTitulo: "Porta-Injetores Compatíveis",  compativelTexto: "Porta-injetores aplicáveis:" },
            valvula: { aplicacaoTitulo: "Aplicação",        aplicacaoTexto: "Válvula presente nas seguintes bombas:",    compativelTitulo: "Bombas Injetoras Compatíveis", compativelTexto: "Algumas das bombas compatíveis (lista parcial):" },
            bomba:   { aplicacaoTitulo: "Aplicação",        aplicacaoTexto: "Aplicável nas seguintes bombas injetoras:",  compativelTitulo: "Bombas Compatíveis",           compativelTexto: "Bombas compatíveis:" },
            outro:   { aplicacaoTitulo: "Aplicação",        aplicacaoTexto: "Aplicável em:",                            compativelTitulo: "Itens Compatíveis",             compativelTexto: "Itens compatíveis:" }
        };

        // ── RENDERIZAÇÃO DINÂMICA ─────────────────────────────────────────
        function renderizarReparo(id) {
            const r = CATALOGO[id];
            const cfg = TIPO_LABELS[r.tipo] || TIPO_LABELS.outro;

            // Badge vazio de imagem
            const imgFallback = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iMzAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMkQyRDJEIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMTYiIGZpbGw9IiM4ODgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5JbWFnZW0gbsOjbyBlbmNvbnRyYWRhPC90ZXh0Pjwvc3ZnPg==`;

            // Seção de aplicação (motores / bombas)
            let aplicacaoHTML = '';
            if (r.motores && r.motores.length > 0) {
                const chips = r.motores.map(m => `<div class="chip">${m}</div>`).join('');
                aplicacaoHTML = `
                    <section class="glass-card reveal">
                        <h2 class="section-title">⚙️ ${cfg.aplicacaoTitulo}</h2>
                        <p class="application-text">${cfg.aplicacaoTexto}</p>
                        <div class="chips-container">${chips}</div>
                    </section>`;
            } else if (r.refComponente) {
                aplicacaoHTML = `
                    <section class="glass-card reveal">
                        <h2 class="section-title">⚙️ ${cfg.aplicacaoTitulo}</h2>
                        <p class="application-text">Reparo destinado ao componente: <strong style="color:var(--primary)">${r.refComponente}</strong></p>
                        <p class="application-text" style="margin-top:8px;font-size:0.9rem;color:var(--text-muted)">${cfg.aplicacaoTexto}</p>
                    </section>`;
            }

            // Observação especial
            let obsHTML = '';
            if (r.observacao) {
                obsHTML = `
                    <section class="glass-card reveal" style="border-left:3px solid var(--primary);">
                        <h2 class="section-title">ℹ️ Observação Técnica</h2>
                        <p class="application-text">${r.observacao}</p>
                    </section>`;
            }

            // Tabela de composição
            const linhasTabela = (r.componentes || []).map(c => {
                const javaCode = c.java || (c.codigos && c.codigos.java) || '';
                const nautCode = c.naut || (c.codigos && c.codigos.naut) || '';
                const boschCode = c.bosch || (c.codigos && c.codigos.bosch) || '';
                return `
                <tr>
                    <td>${c.descricao}</td>
                    <td>${javaCode ? `<span class="code-cell">${javaCode}</span>` : '<span style="color:#555">—</span>'}</td>
                    <td>${nautCode ? `<span class="code-cell">${nautCode}</span>` : '<span style="color:#555">—</span>'}</td>
                    <td>${boschCode ? `<span class="code-cell">${boschCode}</span>` : '<span style="color:#555">—</span>'}</td>
                </tr>`;
            }).join('');

            // Imagens
            const imagensHTML = (r.imagens || []).map(img => `
                <div class="image-card">
                    <img src="${img.src}" alt="${img.legenda}" onerror="this.src='${imgFallback}'">
                    <div class="image-caption">${img.legenda}</div>
                </div>`).join('');

            // Chips de compatíveis
            const chipsCompativeis = (r.portaInjetores || []).map(c =>
                `<div class="injector-chip">${c}</div>`
            ).join('');

            // Monta o HTML final
            document.getElementById('main-content').innerHTML = `
                <div class="hero reveal">
                    <div class="repair-code">${r.codigoExibido || r.id}</div>
                    <div class="repair-subtitle">${r.nome}</div>
                </div>

                ${aplicacaoHTML}
                ${obsHTML}

                <section class="glass-card reveal">
                    <h2 class="section-title">🔩 Composição do Kit</h2>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Componente</th>
                                    <th>Código Java</th>
                                    <th>Código Naut</th>
                                    <th>Código Bosch</th>
                                </tr>
                            </thead>
                            <tbody>${linhasTabela}</tbody>
                        </table>
                    </div>
                </section>

                ${r.imagens && r.imagens.length > 0 ? `
                <section class="reveal">
                    <div class="images-grid">${imagensHTML}</div>
                </section>` : ''}

                <section class="glass-card reveal" style="margin-top:24px">
                    <h2 class="section-title">🔢 ${cfg.compativelTitulo}</h2>
                    <p class="application-text" style="margin-bottom:16px;font-size:0.9rem">${cfg.compativelTexto}</p>
                    <div class="injector-chips">${chipsCompativeis}</div>
                </section>
            `;

            // Ativa animações de scroll
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
            }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
            document.querySelectorAll('.reveal').forEach(el => {
                observer.observe(el);
                if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add('active');
            });
        }

        // ── MESCLAR COM LOCALSTORAGE E JSON DADOS ──────────────────────────
        function carregarDadosLocais() {
            try {
                const local = localStorage.getItem('expan_reparos');
                if (local) {
                    const parsed = JSON.parse(local);
                    parsed.forEach(item => {
                        if (item.id) CATALOGO[item.id.toUpperCase().replace(/\s/g, '')] = item;
                    });
                }
            } catch (e) { console.error('Erro ao ler localStorage', e); }
        }

        function carregarEDesempenharReparo() {
            carregarDadosLocais();
            let rawHash = window.location.hash.substring(1).trim();
            let id = rawHash.toUpperCase().replace(/\s/g, '') || "EXP18121998";

            if (!CATALOGO[id]) {
                document.getElementById('main-content').innerHTML = `
                    <div class="hero reveal active" style="text-align:center">
                        <div class="repair-code" style="font-size:2rem">⚠️</div>
                        <div class="repair-subtitle">Reparo "${rawHash || id}" não encontrado no catálogo.</div>
                    </div>`;
                return;
            }
            renderizarReparo(id);
        }

        // ── INICIALIZAÇÃO ─────────────────────────────────────────────────
        document.addEventListener("DOMContentLoaded", () => {
            carregarEDesempenharReparo();

            // Tenta carregar dados dinâmicos do JSON se disponível
            fetch('data/reparos.json')
                .then(r => r.json())
                .then(data => {
                    if (data && data.reparos) {
                        data.reparos.forEach(item => {
                            const key = item.id.toUpperCase().replace(/\s/g, '');
                            if (!CATALOGO[key]) CATALOGO[key] = item;
                        });
                        carregarEDesempenharReparo();
                    }
                }).catch(() => {});
        });

        window.addEventListener('hashchange', carregarEDesempenharReparo);
    </script>
</body>
</html>
